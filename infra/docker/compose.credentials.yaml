# Explicit opt-in; normal startup must not initialize or unseal this service.
services:
  postgres:
    networks: [default, endpoint-database]
  endpoint-secrets:
    image: quay.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    user: '${MYIMS_ENDPOINT_UID:-1003}:${MYIMS_ENDPOINT_GID:-1003}'
    entrypoint: ['/usr/bin/bao']
    command: ['server', '-config=/bao/config/server.hcl']
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/tmp:mode=0700']
    volumes:
      - ../openbao/server.hcl:/bao/config/server.hcl:ro
      - ../../.local/endpoint-credentials/server.crt:/bao/tls/server.crt:ro
      - ../../.local/endpoint-credentials/server.key:/bao/tls/server.key:ro
      - endpoint-secrets-data:/bao/data
      - endpoint-secrets-audit:/bao/audit
    networks: [endpoint-credentials]
    mem_limit: 512m
  credential-worker:
    extends:
      file: compose.yaml
      service: worker
    profiles: [endpoint-credentials]
    user: '${MYIMS_ENDPOINT_UID:-1003}:${MYIMS_ENDPOINT_GID:-1003}'
    entrypoint: ['node']
    command: ['/workspace/services/backend/dist/entrypoints/worker/main.js']
    environment:
      DATABASE_PASSWORD_FILE: /run/endpoint/db.password
      WORKER_CONSUMER: endpoint-credentials
      ENDPOINT_PROVIDER_URL: https://endpoint-secrets:8200
      ENDPOINT_PROVIDER_CA_FILE: /run/endpoint/ca.crt
      ENDPOINT_PROVIDER_TOKEN_FILE: /run/endpoint/worker.token
      ENDPOINT_PROVIDER_INSTALLATION_ID: '${MYIMS_ENDPOINT_INSTALLATION_ID:-00000000-0000-0000-0000-000000000000}'
    volumes:
      - ../../.local/endpoint-credentials/runtime-db-password:/run/endpoint/db.password:ro
      - ../../.local/endpoint-credentials/ca.crt:/run/endpoint/ca.crt:ro
      - ../../.local/endpoint-credentials/worker-${MYIMS_ENDPOINT_INSTALLATION_ID:-00000000-0000-0000-0000-000000000000}.token:/run/endpoint/worker.token:ro
    networks: [endpoint-database, endpoint-credentials]
networks:
  endpoint-database:
    external: true
    name: myims-rebuild-dev_endpoint-database
  endpoint-credentials:
    internal: true
volumes:
  endpoint-secrets-data:
  endpoint-secrets-audit:
