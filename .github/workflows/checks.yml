name: Workspace checks
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ./dev up
      - run: ./dev exec env CI=1 pnpm check
      - run: ./dev foundation-check
      - if: always()
        run: ./dev down
