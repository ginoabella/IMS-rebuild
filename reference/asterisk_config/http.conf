; Local HTTP/WebSocket foundation for browser WebRTC development.
; This first pass intentionally keeps localhost-friendly plain WebSocket enabled
; on 8088 so the command-center browser can register a PJSIP-over-WS endpoint
; without waiting for repo-owned TLS certificate plumbing.

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088

; Reserve the secure listener shape for a later hardening pass once the repo
; owns repeatable local certificate generation and browser HTTPS delivery.
tlsenable=no
tlsbindaddr=0.0.0.0:8089

