; Minimal dial plan for the first PBX milestone.
; This is intentionally limited to local extension-to-extension calling.

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
CONSOLE=Console/dsp
ERS_RECORDING_ROOT=/var/spool/asterisk/monitor/ers

[recording-foundation]
exten => s,1,NoOp(Start ${ARG1} recording for linked call ${IF($["${CHANNEL(linkedid)}"=""]?${UNIQUEID}:${CHANNEL(linkedid)})})
 same => n,Set(__ERS_RECORDING_CALL_ID=${IF($["${CHANNEL(linkedid)}"=""]?${UNIQUEID}:${CHANNEL(linkedid)})})
 same => n,Set(__ERS_RECORDING_DATE_PATH=${STRFTIME(${EPOCH},,%Y/%m/%d)})
 same => n,Set(__ERS_RECORDING_TIMESTAMP=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,Set(__ERS_RECORDING_FROM_RAW=${IF($["${ARG2}"=""]?unknown:${ARG2})})
 same => n,Set(__ERS_RECORDING_TO_RAW=${IF($["${ARG3}"=""]?unknown:${ARG3})})
 same => n,Set(__ERS_RECORDING_FROM=${FILTER(0-9A-Za-z,${ERS_RECORDING_FROM_RAW})})
 same => n,Set(__ERS_RECORDING_TO=${FILTER(0-9A-Za-z,${ERS_RECORDING_TO_RAW})})
 same => n,Set(__ERS_RECORDING_PATH=${ERS_RECORDING_ROOT}/${ERS_RECORDING_DATE_PATH})
 same => n,System(/bin/mkdir -p ${ERS_RECORDING_PATH})
 same => n,Set(__ERS_RECORDING_FILE=${ERS_RECORDING_PATH}/recording__${ERS_RECORDING_CALL_ID}__${ERS_RECORDING_TIMESTAMP}__route-${ARG1}__from-${ERS_RECORDING_FROM}__to-${ERS_RECORDING_TO}.wav)
 same => n,NoOp(MixMonitor target ${ERS_RECORDING_FILE})
 same => n,MixMonitor(${ERS_RECORDING_FILE})
 same => n,Return()

[local-users]
exten => 1001,1,NoOp(Incoming call for extension 1001)
 same => n,Dial(PJSIP/1001,20)
 same => n,Voicemail(1001@default,u)
 same => n,Hangup()

exten => 1002,1,NoOp(Incoming call for extension 1002)
 same => n,Dial(PJSIP/1002,20)
 same => n,Voicemail(1002@default,u)
 same => n,Hangup()

exten => 1003,1,NoOp(Incoming call for extension 1003)
 same => n,Dial(PJSIP/1003,20)
 same => n,Voicemail(1003@default,u)
 same => n,Hangup()

exten => 2001,1,NoOp(Incoming call for extension 2001)
 same => n,Dial(PJSIP/2001,20)
 same => n,Hangup()

exten => 2002,1,NoOp(Incoming call for extension 2002)
 same => n,Dial(PJSIP/2002,20)
 same => n,Hangup()

exten => 6101,1,NoOp(Incoming call for browser WebRTC extension 6101)
 same => n,Dial(PJSIP/6101,20)
 same => n,Hangup()

exten => 6102,1,NoOp(Incoming call for browser WebRTC extension 6102)
 same => n,Dial(PJSIP/6102,20)
 same => n,Hangup()

exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()

exten => 6000,1,NoOp(Echo test alias)
 same => n,Goto(600,1)

exten => 9000,1,NoOp(Test ring group for local users)
 same => n,Set(CHANNEL(after_bridge_goto)=local-users,9000-post-bridge,1)
 same => n,Dial(PJSIP/1001&PJSIP/1002,20,g)
 same => n,NoOp(Test ring group was not answered)
 same => n,Hangup()

exten => 9000-post-bridge,1,NoOp(Answered local-user bridge ended)
 same => n,Hangup()

exten => 9001,1,NoOp(Test ring group for local extensions 2001 and 2002)
 same => n,Set(CHANNEL(after_bridge_goto)=local-users,9001-post-bridge,1)
 same => n,Dial(PJSIP/2001&PJSIP/2002,20,g)
 same => n,NoOp(Local extension ring group was not answered)
 same => n,Hangup()

exten => 9001-post-bridge,1,NoOp(Answered local extension bridge ended)
 same => n,Hangup()

exten => 9100,1,NoOp(Test ring group for browser WebRTC users)
 same => n,Set(CHANNEL(after_bridge_goto)=local-users,9100-post-bridge,1)
 same => n,Dial(PJSIP/6101&PJSIP/6102,40,g)
 same => n,NoOp(Browser WebRTC test ring group was not answered)
 same => n,Hangup()

exten => 9100-post-bridge,1,NoOp(Answered browser-WebRTC bridge ended)
 same => n,Hangup()

; Dial 9 followed by the outside number to send calls through the TG200 gateway.
exten => _9X.,1,NoOp(Outbound call through TG200 to ${EXTEN:1})
 same => n,GoSub(recording-foundation,s,1(runtime-outbound,${CALLERID(num)},${EXTEN:1}))
 same => n,Dial(PJSIP/${EXTEN:1}@tg200-trunk,60)
 same => n,Hangup()

[from-tg200]
exten => _X.,1,NoOp(Inbound call from TG200 to ${EXTEN})
 same => n,GoSub(recording-foundation,s,1(runtime-inbound,${CALLERID(num)},9000))
 same => n,Goto(local-users,9000,1)

exten => s,1,NoOp(Inbound call from TG200 without a DID)
 same => n,GoSub(recording-foundation,s,1(runtime-inbound,${CALLERID(num)},9000))
 same => n,Goto(local-users,9000,1)

[from-public-mobile-webrtc]
exten => _pmwrtc-.,1,NoOp(Inbound public-mobile WebRTC emergency call for ${EXTEN})
 same => n,Set(__ERS_PUBLIC_CALL_CORRELATION_ID=${EXTEN})
 same => n,Set(CALLERID(name)=${EXTEN})
 same => n,GoSub(recording-foundation,s,1(runtime-public-mobile,${CALLERID(num)},9100))
 same => n,Goto(local-users,9100,1)

exten => s,1,NoOp(Rejected public-mobile WebRTC call without explicit session correlation)
 same => n,Hangup(21)

; The mounted artifact begins as an intentionally empty, infrastructure-owned
; no-op. Unit 5 alone may later render the bounded managed dialplan family.
#include "managed-config/current/extensions-managed.conf"
