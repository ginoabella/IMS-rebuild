; Minimal module loading configuration for local PBX development.

[modules]
autoload=yes

; Keep local extension-to-extension media anchored in Asterisk for Docker-based
; development. Echo tests work through Asterisk, while native RTP bridging can
; advertise or use network paths that are not reachable between local clients.
noload=bridge_native_rtp.so

; Local development uses checked-in configuration files and the ERS API owns
; database persistence, so Asterisk does not need LDAP or PostgreSQL Realtime,
; CDR, or CEL backends.
noload=res_config_ldap.so
noload=res_config_pgsql.so
noload=cdr_pgsql.so
noload=cel_pgsql.so
noload=cdr_sqlite3_custom.so
noload=cel_sqlite3_custom.so

; HEP packet export is not part of the local observability path.
noload=res_hep.so
noload=res_hep_pjsip.so
noload=res_hep_rtcp.so

; Containerized calls use PJSIP/RTP and do not have a local ALSA sound device.
noload=chan_console.so

; The local dialplan is standard extensions.conf syntax and recordings use WAV,
; so avoid loading unused AEL and the unavailable Vorbis formatter.
noload=pbx_ael.so
noload=format_ogg_vorbis.so
