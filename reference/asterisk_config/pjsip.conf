[6102]
type=endpoint
transport=transport-ws
context=local-users
disallow=all
allow=opus
allow=ulaw
allow=alaw
auth=6102
aors=6102
direct_media=no
; Keep the second browser endpoint on the same browser-safe signaling domain.
from_domain=__ASTERISK_EXTERNAL_ADDRESS__
media_address=__ASTERISK_EXTERNAL_ADDRESS__
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
rtcp_mux=yes
use_avpf=yes
media_encryption=dtls
dtls_auto_generate_cert=yes
media_use_received_transport=yes
webrtc=yes

[tg200-trunk]
type=aor
contact=sip:172.16.11.12:5060
qualify_frequency=30

[tg200-trunk]
type=endpoint
context=from-tg200
transport=transport-udp
disallow=all
allow=ulaw
allow=alaw
aors=tg200-trunk
direct_media=no
media_address=__ASTERISK_EXTERNAL_ADDRESS__
dtmf_mode=rfc4733
rtp_symmetric=yes
force_rport=yes
rewrite_contact=no

[tg200-trunk]
type=identify
endpoint=tg200-trunk
match=172.16.11.12
match_header=From: /sip:.*@172\.16\.11\.12/

