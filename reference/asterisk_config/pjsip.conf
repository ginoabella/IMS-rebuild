; Minimal PJSIP configuration for the first PBX milestone plus a local browser
; WebRTC endpoint foundation. The repo keeps the earlier UDP desk-phone
; baseline for `1001` and `1002`, while also provisioning browser-oriented
; `6101` and `6102` endpoints for the fixed operator-extension model used by
; the command-center telephony workflow.

[global]
type=global
user_agent=IMS-PBX
; Match registered operator endpoints by username first, then allow the local
; Docker bridge to route one-off public-mobile WebRTC calls into the ingress
; context. The current local image does not ship the PJSIP header identifier.
endpoint_identifier_order=username,ip,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=__ASTERISK_EXTERNAL_ADDRESS__
external_signaling_port=5060
external_media_address=__ASTERISK_EXTERNAL_ADDRESS__
; Docker Desktop forwards host SIP traffic through its bridge gateway. Do not
; add that bridge subnet as local_net: PJSIP would then put the private
; container address in the dialog Contact header, leaving LAN softphones
; unable to deliver their in-dialog BYE to Asterisk.

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
external_signaling_address=__ASTERISK_EXTERNAL_ADDRESS__
external_signaling_port=8088
external_media_address=__ASTERISK_EXTERNAL_ADDRESS__

; Narrow public-mobile ingress endpoint for one-off WebRTC emergency calls.
; This stays separate from operator browser endpoints and is identified only by
; the temporary public-call SIP username pattern. That keeps TG200 and other
; SIP traffic on their own trusted identify seams instead of letting
; public-mobile ingress claim generic bridge-subnet requests.
[public-mobile-webrtc-ingress]
type=endpoint
transport=transport-ws
context=from-public-mobile-webrtc
disallow=all
allow=opus
allow=ulaw
allow=alaw
direct_media=no
media_address=__ASTERISK_EXTERNAL_ADDRESS__
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
rtcp_mux=yes
use_avpf=yes
media_encryption=dtls
dtls_auto_generate_cert=yes
media_use_received_transport=yes
webrtc=yes

[public-mobile-webrtc-ingress]
type=identify
endpoint=public-mobile-webrtc-ingress
match_header=From: /sip:pmwrtc-[0-9a-f]+@/

[1001]
type=auth
auth_type=userpass
username=1001
password=ims1001pass

[1001]
type=aor
max_contacts=1
remove_existing=yes

[1001]
type=endpoint
context=local-users
disallow=all
allow=ulaw
allow=alaw
auth=1001
aors=1001
direct_media=no
media_address=__ASTERISK_EXTERNAL_ADDRESS__
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1002]
