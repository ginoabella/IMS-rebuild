remove_existing=yes

[6101]
type=endpoint
transport=transport-ws
context=local-users
disallow=all
allow=opus
allow=ulaw
allow=alaw
auth=6101
aors=6101
direct_media=no
; Use the configured host address in outbound INVITEs. Without this, Asterisk
; falls back to its Docker container hostname in the From URI, which SIP.js
; rejects before the command-center operator can answer a public-mobile call.
from_domain=__ASTERISK_EXTERNAL_ADDRESS__
media_address=__ASTERISK_EXTERNAL_ADDRESS__
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
rtcp_mux=yes
use_avpf=yes
media_encryption=dtls
dtls_auto_generate_cert=yes
media_use_received_transport=yes
webrtc=yes

